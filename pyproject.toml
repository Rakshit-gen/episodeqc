[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "episodeqc"
version = "0.1.0"
description = "Check audio episodes against loudness and delivery specs before they ship"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
